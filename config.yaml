# Huvudkonfiguration för tradeboten.
# API-nycklar läggs i .env (se .env.example), aldrig här.

exchange:
  id: bybit            # vilket ccxt-exchange som används: bybit, binance, kraken ...
  testnet: true        # true = exchangens sandbox/testnet i live-läge

market:
  symbols:
    - BTC/USDT
    - ETH/USDT
  timeframe: 4h        # candle-upplösning: 1m, 5m, 15m, 1h, 4h, 1d ...
  candle_limit: 300    # antal candles som hämtas per analys

trading:
  mode: spot           # "spot" = köp/sälj utan hävstång, "futures" = perpetuals
  strategy: ema_cross  # ema_cross | donchian | rsi_meanrev
  leverage: 2          # endast futures; håll LÅGT (2-3). Max 10. Se docs/STRATEGIER.md
  allow_shorts: true   # endast futures: tillåt korta positioner

strategy:
  # ema_cross (trendföljning)
  ema_fast: 12
  ema_slow: 26
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  # donchian (breakout)
  donchian_entry: 20   # entry: stängning utanför högsta/lägsta N candles
  donchian_exit: 10    # exit: stängning utanför motsatt N-kanal
  # rsi_meanrev (mean reversion)
  meanrev_trend_ema: 200
  meanrev_exit_rsi: 50
  # gemensamt: ATR-baserade stop/take-nivåer
  atr_period: 14
  atr_stop_mult: 2.0   # stop loss = entry -/+ 2.0 * ATR
  atr_take_mult: 3.0   # take profit = entry +/- 3.0 * ATR
  # regimfilter: trendstrategierna (ema_cross, donchian) öppnar bara
  # positioner när ADX >= adx_min. 0 stänger av filtret.
  adx_period: 14
  adx_min: 20

risk:
  start_equity: 10000        # startkapital i paper-läge (quote-valuta, t.ex. USDT)
  risk_per_trade_pct: 1.0    # max % av kapitalet som riskeras per trade
  max_positions: 2           # max antal samtidiga positioner
  max_daily_loss_pct: 5.0    # stoppa handeln för dagen vid denna förlust
  min_order_quote: 10        # minsta ordervärde i quote-valuta

bot:
  poll_seconds: 60           # hur ofta boten kollar marknaden
  state_file: state/portfolio.json
  log_file: tradebot.log
