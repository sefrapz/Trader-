# Daytrading-profil: VWAP + struktur + volymbreakout + återtest på 5m.
# Körs PARALLELLT med swing-systemet (config.yaml) — egna state-filer.
#
#   python main.py backtest --config config.daytrade.yaml --candles 17280
#   python main.py paper    --config config.daytrade.yaml
#
# OBS: intradagshandel är där avgifterna gör mest skada (se BESLUTSLOGG).
# Denna profil är ETT EXPERIMENT tills backtest + paper bevisat motsatsen.

exchange:
  id: bybit
  testnet: true

market:
  symbols:
    - BTC/USDT
    - ETH/USDT
  timeframe: 5m
  candle_limit: 400          # ~33h — täcker dagens VWAP + alla lookbacks

trading:
  mode: futures
  strategy: intraday_momentum
  leverage: 2
  allow_shorts: true

strategy:
  atr_period: 14
  # entrylogik
  structure_ema: 20          # 15m-EMA för riktningsstruktur
  structure_slope_bars: 3
  breakout_lookback: 20      # "senaste 20 periodernas högsta/lägsta"
  vol_sma: 20
  vol_mult: 1.5              # breakoutvolym minst 1.5x normal
  retest_window: 6           # max 30 min (6 x 5m) på återtest + vändning
  retest_tol_pct: 0.1
  vwap_min_atr_dist: 0.25    # skydd mot platt/korsande VWAP
  day_rr_take: 2.0           # mål = 2R

risk:
  start_equity: 10000
  risk_per_trade_pct: 0.5    # lägre än swing: fler trades = mer total exponering
  max_positions: 2
  max_daily_loss_pct: 3.0    # stramare daglig broms för daytrading
  min_order_quote: 10

bot:
  poll_seconds: 60           # 5m-candles kräver tät poll
  state_file: state/portfolio_day.json
  log_file: tradebot_day.log
  journal_file: state/journal_day.jsonl
  backtest_journal_file: state/journal_backtest_day.jsonl
  analysis_file: state/analysis_day.txt
